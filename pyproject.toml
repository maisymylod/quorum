[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum"
version = "0.1.0"
description = "Population simulation engine: synthesize a representative population from real census marginals, predict how it answers a question with a hybrid LLM and classical architecture, and score the prediction against real published survey results."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maisy Mylod" }]
keywords = ["simulation", "agent-based-modeling", "poststratification", "survey", "monte-carlo"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
report = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "anthropic>=0.40",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
]

[project.scripts]
quorum = "quorum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quorum = ["py.typed"]
"quorum.templates" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["quorum"]
omit = ["*/cli.py", "*/publish/plots.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
