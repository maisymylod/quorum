<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" width="840" height="700"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     role="img" aria-label="The quorum simulation loop, from ground truth through synthesis, world modelling, hybrid prediction, estimation, scoring and publication.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6470"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="700" fill="#ffffff"/>

  <!-- ground truth -->
  <rect x="200" y="26" width="340" height="56" rx="8" fill="#eef4f8" stroke="#1b4965" stroke-width="1.2"/>
  <text x="216" y="48" font-size="12" font-weight="600" fill="#1b4965" letter-spacing="0.06em">CENSUS MICRODATA</text>
  <text x="216" y="68" font-size="11.5" fill="#5b6470">ACS 2024 PUMS, 2.79M adult records, 267M adults</text>

  <rect x="600" y="26" width="220" height="56" rx="8" fill="#fdf3ea" stroke="#f4a259" stroke-width="1.2"/>
  <text x="616" y="48" font-size="12" font-weight="600" fill="#a2551b" letter-spacing="0.06em">SURVEY ANSWERS</text>
  <text x="616" y="68" font-size="11.5" fill="#5b6470">GSS 2024, 41 items, 11 splits</text>

  <!-- main column -->
  <rect x="200" y="132" width="340" height="58" rx="8" fill="#f7f9fa" stroke="#c7d0d8" stroke-width="1.2"/>
  <text x="216" y="155" font-size="12" font-weight="600" fill="#1f2933" letter-spacing="0.06em">1  SYNTHESIZE</text>
  <text x="216" y="175" font-size="11.5" fill="#5b6470">resample microdata, rake onto the target marginals</text>

  <rect x="200" y="216" width="340" height="58" rx="8" fill="#f7f9fa" stroke="#c7d0d8" stroke-width="1.2"/>
  <text x="216" y="239" font-size="12" font-weight="600" fill="#1f2933" letter-spacing="0.06em">2  MODEL THE WORLD</text>
  <text x="216" y="259" font-size="11.5" fill="#5b6470">homophilous graph, bounded-confidence influence</text>

  <rect x="200" y="300" width="340" height="58" rx="8" fill="#eef4f8" stroke="#1b4965" stroke-width="1.6"/>
  <text x="216" y="323" font-size="12" font-weight="600" fill="#1b4965" letter-spacing="0.06em">3  PREDICT RESPONSES</text>
  <text x="216" y="343" font-size="11.5" fill="#5b6470">hybrid: a model on archetypes, classical on the rest</text>

  <rect x="200" y="384" width="340" height="58" rx="8" fill="#f7f9fa" stroke="#c7d0d8" stroke-width="1.2"/>
  <text x="216" y="407" font-size="12" font-weight="600" fill="#1f2933" letter-spacing="0.06em">4  ESTIMATE</text>
  <text x="216" y="427" font-size="11.5" fill="#5b6470">partial pooling, poststratification, intervals</text>

  <rect x="200" y="468" width="340" height="58" rx="8" fill="#fdf3ea" stroke="#f4a259" stroke-width="1.6"/>
  <text x="216" y="491" font-size="12" font-weight="600" fill="#a2551b" letter-spacing="0.06em">5  SCORE</text>
  <text x="216" y="511" font-size="11.5" fill="#5b6470">against answers the engine never saw</text>

  <rect x="200" y="552" width="340" height="58" rx="8" fill="#f7f9fa" stroke="#c7d0d8" stroke-width="1.2"/>
  <text x="216" y="575" font-size="12" font-weight="600" fill="#1f2933" letter-spacing="0.06em">6  PUBLISH</text>
  <text x="216" y="595" font-size="11.5" fill="#5b6470">one self-contained, decision-ready artifact</text>

  <!-- flow -->
  <line x1="370" y1="82" x2="370" y2="128" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="370" y1="190" x2="370" y2="212" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="370" y1="274" x2="370" y2="296" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="370" y1="358" x2="370" y2="380" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="370" y1="442" x2="370" y2="464" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="370" y1="526" x2="370" y2="548" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- the answer key reaches only the scoring step -->
  <path d="M 710 82 L 710 497 L 548 497" fill="none" stroke="#f4a259" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="722" y="290" font-size="11" fill="#a2551b" transform="rotate(90 722 290)">answer key, never an input</text>

  <!-- what the hybrid does -->
  <rect x="20" y="300" width="160" height="150" rx="8" fill="#ffffff" stroke="#c7d0d8"
        stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="34" y="322" font-size="11" font-weight="600" fill="#1b4965" letter-spacing="0.06em">THE SPLIT</text>
  <text x="34" y="345" font-size="11.5" fill="#1f2933">300 archetypes</text>
  <text x="34" y="361" font-size="11" fill="#5b6470">measured by the model</text>
  <text x="34" y="386" font-size="11.5" fill="#1f2933">20,000 agents</text>
  <text x="34" y="402" font-size="11" fill="#5b6470">scored by the propagator</text>
  <line x1="34" y1="416" x2="166" y2="416" stroke="#e3e7eb" stroke-width="1"/>
  <text x="34" y="435" font-size="11" fill="#5b6470">cost is O(archetypes)</text>
  <line x1="182" y1="329" x2="196" y2="329" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- provenance -->
  <rect x="200" y="640" width="340" height="36" rx="8" fill="#ffffff" stroke="#e3e7eb" stroke-width="1.2"/>
  <text x="216" y="663" font-size="11" fill="#5b6470">every run stamps spec hash, seed, population hash, cost</text>
</svg>
